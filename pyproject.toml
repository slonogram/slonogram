[project]
name = "slonogram"
version = "0.9"
description = "Extensible and powerful telegram bot library"
authors = [ { name = "nerodono", email = "nerodono0@gmail.com" } ]
requires-python = ">= 3.11"
dependencies = [
  "anyio >= 4.3,<=5",
]

[project.optional-dependencies]
aiohttp = [
  "aiohttp >= 3,<=4"
]

[build-system]
requires = ["setuptools >= 69.0"]
build-backend = "setuptools.build_meta"
